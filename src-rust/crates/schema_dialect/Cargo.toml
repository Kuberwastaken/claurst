[package]
name = "claurst-schema-dialect"
version = "0.2.0"
edition = "2024"
publish = false

[lib]
name = "claurst_schema_dialect"
path = "src/lib.rs"

[dependencies]
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Exposes the per-thread quirk-store redirect so integration tests (which see
# the crate as an external dependency) can isolate themselves from the real
# ~/.claurst store.
test-support = []

[dev-dependencies]
tempfile = "3"
claurst-schema-dialect = { path = ".", features = ["test-support"] }